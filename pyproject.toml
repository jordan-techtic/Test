[project]
name = "marketing-content-calendar-api"
version = "0.1.0"
description = "Marketing Content Calendar backend API"
requires-python = ">=3.11"
dependencies = []

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["logs*", "tests*", "docs*", "scripts*", "alembic*", "migrations*"]
